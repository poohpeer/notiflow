# Per-IP rate limits. The api's own RateLimiter keys on channel:recipient, which
# says nothing about who is calling — one host can still hammer it. These zones
# are the missing per-client bound. Keyed on $binary_remote_addr: behind an ALB
# or CloudFront that is the proxy's IP, so add the realip module and key on
# X-Forwarded-For before putting a load balancer in front of this.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
# Login is a credential oracle — keep it slow enough that online brute force is
# pointless. 20/min with a small burst still leaves room for a fat-fingered user.
limit_req_zone $binary_remote_addr zone=login:1m rate=20r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Reach the backend and Prometheus through the host, exactly like the
    # Prometheus scrape config does. host.docker.internal:PORT resolves to the
    # host's published port, which works whether the backend runs in the IDE
    # (port bound on the host) or in Docker (container port published to the
    # host). This decouples the frontend from where the backend lives, so it
    # can be started on its own. Requires extra_hosts in docker-compose.yml.

    # More specific than /api/ below, so this wins for the login endpoint.
    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;

        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # notiflow-api — backend already serves under the /api context path.
    location /api/ {
        # The dashboard fans out into several parallel calls per page, hence the
        # burst; nodelay lets a page load through at once but still caps the rate.
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Prometheus HTTP API — strip the /prom prefix (trailing slash on target).
    # Prometheus has no auth of its own: anyone who can reach this path can read
    # delivery volumes and recipients. Restrict it before exposing this publicly.
    location /prom/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://host.docker.internal:9090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
