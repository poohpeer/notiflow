server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Reach the backend and Prometheus through the host, exactly like the
    # Prometheus scrape config does. host.docker.internal:PORT resolves to the
    # host's published port, which works whether the backend runs in the IDE
    # (port bound on the host) or in Docker (container port published to the
    # host). This decouples the frontend from where the backend lives, so it
    # can be started on its own. Requires extra_hosts in docker-compose.yml.

    # notiflow-api — backend already serves under the /api context path.
    location /api/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Prometheus HTTP API — strip the /prom prefix (trailing slash on target).
    location /prom/ {
        proxy_pass http://host.docker.internal:9090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
