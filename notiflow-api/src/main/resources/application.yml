server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: notiflow-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notiflow}
    username: ${SPRING_DATASOURCE_USERNAME:notiflow}
    password: ${SPRING_DATASOURCE_PASSWORD:notiflow}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs

notiflow:
  rate-limit:
    max-requests: ${NOTIFLOW_RATE_LIMIT_MAX_REQUESTS:5}
    window: ${NOTIFLOW_RATE_LIMIT_WINDOW:PT1M}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
